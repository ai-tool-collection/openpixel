version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, skip-changelog]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    labels: [dependencies, website]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /app
    schedule: { interval: weekly }
    labels: [dependencies]
